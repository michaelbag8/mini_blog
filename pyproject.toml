[project]
name = "mini_blog"
version = "0.1.0"
description = "A mini blog built using FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.5",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.12.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mini_blog = "mini_blog:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
